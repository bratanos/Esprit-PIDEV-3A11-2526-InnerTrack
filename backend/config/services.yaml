
# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    imgbb_api_key: '%env(IMGBB_API_KEY)%'
    brevo_api_key:      '%env(BREVO_API_KEY)%'
    brevo_sender_email: '%env(BREVO_SENDER_EMAIL)%'
    brevo_app_name:     '%env(BREVO_APP_NAME)%'
    twilio_account_sid: '%env(TWILIO_ACCOUNT_SID)%'
    twilio_auth_token:  '%env(TWILIO_AUTH_TOKEN)%'
    twilio_from_number: '%env(TWILIO_FROM_NUMBER)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\EventSubscriber\LocaleSubscriber:
        arguments:
            $defaultLocale: '%kernel.default_locale%'

    App\Service\BrevoEmailService:
        arguments:
            $apiKey:       '%brevo_api_key%'
            $senderEmail:  '%brevo_sender_email%'
            $appName:      '%brevo_app_name%'

    App\Service\TwilioService:
        arguments:
            $accountSid:  '%twilio_account_sid%'
            $authToken:   '%twilio_auth_token%'
            $fromNumber:  '%twilio_from_number%'

    App\Service\BrevoMailer:
        arguments:
            $brevoApiKey: '%brevo_api_key%'

    App\Service\FreeSoundService:
        arguments:
            $apiKey: '%env(FREESOUND_API_KEY)%'
